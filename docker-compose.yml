version: '3.8'

services:
  devlink-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devlink-platform
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
    volumes:
      - ./server/data:/app/server/data
